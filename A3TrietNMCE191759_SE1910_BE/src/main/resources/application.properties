server.port=8080
spring.application.name=SBA301_HotelManagementSystem
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=A3TrietNMCE191759_SE1910;encrypt=true;trustServerCertificate=true}
